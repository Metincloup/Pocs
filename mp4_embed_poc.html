<!doctype html>
<meta charset="utf-8">
<title>Owned MP4 metadata parser gate</title>
<style>
  body { max-width: 780px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
  button { padding: .75rem 1rem; font: inherit; }
  pre { min-height: 13rem; padding: 1rem; border: 1px solid #888; white-space: pre-wrap; }
  video { display: block; width: 160px; height: 100px; margin-top: 1rem; background: #222; }
</style>
<h1>Owned MP4 metadata parser gate</h1>
<p id="description"></p>
<button id="run" type="button" disabled>Load metadata once</button>
<pre id="out">Select mode with ?mode=control or ?mode=candidate.</pre>
<div id="media"></div>
<script>
  const params = new URLSearchParams(location.search);
  const mode = params.get('mode');
  const button = document.querySelector('#run');
  const output = document.querySelector('#out');
  const description = document.querySelector('#description');
  const media = document.querySelector('#media');
  const expected = {
    candidate: '0afba19b139181d7df4fd82de3c18e8b30c156cebd257aa470584095928360b3',
    control: '776187c861620a13e3599f0b28fd9e3e9e19ba19ea7d2959d66a8e1a132f069f',
  };

  const show = value => {
    output.textContent = JSON.stringify(value, null, 2);
  };

  const sha256 = async bytes => {
    const digest = await crypto.subtle.digest('SHA-256', bytes);
    return [...new Uint8Array(digest)]
      .map(value => value.toString(16).padStart(2, '0'))
      .join('');
  };

  if (mode === 'control' || mode === 'candidate') {
    description.textContent = mode === 'control'
      ? 'Benign control. Loads metadata only; it never plays the video.'
      : 'Candidate. Loads metadata once; it never plays the video.';
    button.disabled = false;
    show({ outcome: 'ready', mode, played: false, repeated: false });
  }

  button.addEventListener('click', async () => {
    button.disabled = true;
    try {
      const response = await fetch('./mp4_stss_count_crash_candidate.mp4', {
        cache: 'no-store',
        credentials: 'omit',
      });
      if (!response.ok) throw new Error(`fixture HTTP ${response.status}`);

      const bytes = new Uint8Array(await response.arrayBuffer());
      if (bytes.length !== 1267) throw new Error(`unexpected fixture length ${bytes.length}`);
      if (bytes[1259] !== 0x20) throw new Error('unexpected candidate marker byte');

      if (mode === 'control') bytes[1259] = 0x00;
      const hash = await sha256(bytes);
      if (hash !== expected[mode]) throw new Error(`unexpected ${mode} hash`);

      show({
        outcome: 'loading-metadata-once',
        mode,
        byteLength: bytes.length,
        sha256: hash,
        played: false,
        repeated: false,
        transmittedAnything: false,
        userAgent: navigator.userAgent,
      });

      const video = document.createElement('video');
      video.muted = true;
      video.preload = 'metadata';
      video.playsInline = true;
      video.controls = false;

      const objectUrl = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
      const finish = (outcome, extra = {}) => {
        show({
          outcome,
          mode,
          byteLength: bytes.length,
          sha256: hash,
          played: false,
          repeated: false,
          transmittedAnything: false,
          ...extra,
        });
      };

      video.addEventListener('loadedmetadata', () => finish('renderer-survived-loadedmetadata', {
        duration: Number.isFinite(video.duration) ? video.duration : null,
        videoWidth: video.videoWidth,
        videoHeight: video.videoHeight,
      }), { once: true });
      video.addEventListener('error', () => finish('renderer-survived-media-error', {
        mediaErrorCode: video.error?.code ?? null,
      }), { once: true });

      media.append(video);
      video.src = objectUrl;
      video.load();

      setTimeout(() => {
        if (output.textContent.includes('loading-metadata-once')) {
          finish('renderer-survived-timeout');
        }
      }, 5000);
    } catch (error) {
      show({
        outcome: 'setup-error-before-media-load',
        mode,
        error: {
          name: String(error?.name || 'Error'),
          message: String(error?.message || error).slice(0, 300),
        },
      });
    }
  }, { once: true });
</script>
