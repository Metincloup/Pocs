<!doctype html>
<meta charset="utf-8">
<title>Owned SpeechRecognition renderer survival check</title>
<style>
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
  button { padding: .75rem 1rem; font: inherit; }
  pre { min-height: 8rem; padding: 1rem; border: 1px solid #888; white-space: pre-wrap; }
</style>
<h1>SpeechRecognition renderer survival check</h1>
<p>
  One bounded API call. It does not request microphone permission, start
  recognition, install a language pack, transmit data, or repeat automatically.
</p>
<button id="run" type="button">Run once</button>
<pre id="out">Not run.</pre>
<script>
  const button = document.querySelector('#run');
  const output = document.querySelector('#out');

  button.addEventListener('click', async () => {
    button.disabled = true;
    const Speech = globalThis.SpeechRecognition;
    const result = {
      speechRecognitionType: typeof Speech,
      availableType: typeof Speech?.available,
      requestedMicrophone: false,
      startedRecognition: false,
      installedAnything: false,
      transmittedAnything: false,
    };

    if (typeof Speech?.available !== 'function') {
      output.textContent = JSON.stringify({ ...result, outcome: 'api-unavailable' }, null, 2);
      return;
    }

    output.textContent = JSON.stringify({ ...result, outcome: 'calling-once' }, null, 2);
    try {
      const value = await Speech.available({
        langs: ['en-US'],
        processLocally: true,
      });
      output.textContent = JSON.stringify({
        ...result,
        outcome: 'renderer-survived',
        value,
      }, null, 2);
    } catch (error) {
      output.textContent = JSON.stringify({
        ...result,
        outcome: 'renderer-survived-with-error',
        error: {
          name: String(error?.name || 'Error'),
          message: String(error?.message || error).slice(0, 300),
        },
      }, null, 2);
    }
  }, { once: true });

  // Terminal harness only. The ordinary hosted PoC has no query and therefore
  // remains a one-click gate.
  if (new URLSearchParams(location.search).get('harness') === '1') {
    setTimeout(() => button.click(), 100);
  }
</script>
