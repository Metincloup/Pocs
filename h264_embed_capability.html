<!doctype html>
<meta charset="utf-8">
<title>Owned ANGLE sampler-name control</title>
<style>
  body { max-width: 780px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
  button { padding: .75rem 1rem; font: inherit; }
  pre { min-height: 17rem; padding: 1rem; border: 1px solid #888; white-space: pre-wrap; }
</style>
<h1>ANGLE sampler-name control</h1>
<p>One small shader, one draw and one-pixel readback. The colliding field is renamed.</p>
<button id="run" type="button">Run control once</button>
<pre id="out">Ready.</pre>
<script>
  const fragmentShader = `
precision highp float;
struct S { sampler2D s; };
uniform struct A {
  vec4 v;
  S a;
  sampler2D safe_sampler_name;
} a;
void main() {
  gl_FragColor = a.v;
}`;

  const button = document.querySelector('#run');
  const output = document.querySelector('#out');
  button.addEventListener('click', () => {
    button.disabled = true;
    const gl = document.createElement('canvas').getContext('webgl', {
      alpha: true,
      antialias: false,
      preserveDrawingBuffer: true,
    });
    if (!gl) {
      output.textContent = JSON.stringify({ outcome: 'no-webgl' }, null, 2);
      return;
    }
    const debug = gl.getExtension('WEBGL_debug_renderer_info');
    const compile = (type, source) => {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      return shader;
    };
    const vertex = compile(gl.VERTEX_SHADER,
      'attribute vec4 a_position; void main(){ gl_Position = a_position; }');
    const fragment = compile(gl.FRAGMENT_SHADER, fragmentShader);
    const program = gl.createProgram();
    gl.attachShader(program, vertex);
    gl.attachShader(program, fragment);
    gl.linkProgram(program);
    const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
    let pixel = [];
    if (linked) {
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER,
        new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'a_position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      const bytes = new Uint8Array(4);
      gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
      pixel = [...bytes];
      bytes.fill(0);
    }
    gl.finish();
    output.textContent = JSON.stringify({
      outcome: 'control-returned',
      vertexCompiled: gl.getShaderParameter(vertex, gl.COMPILE_STATUS),
      fragmentCompiled: gl.getShaderParameter(fragment, gl.COMPILE_STATUS),
      vertexLog: gl.getShaderInfoLog(vertex).slice(0, 300),
      fragmentLog: gl.getShaderInfoLog(fragment).slice(0, 300),
      linked,
      linkLog: gl.getProgramInfoLog(program).slice(0, 300),
      pixel,
      glError: gl.getError(),
      renderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER),
      uploadedData: false,
      transmittedAnything: false,
    }, null, 2);
  }, { once: true });
</script>
