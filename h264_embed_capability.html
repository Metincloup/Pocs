<!doctype html>
<meta charset="utf-8">
<title>Canva Desktop I010 single-frame gate</title>
<style>
  body { font: 14px system-ui; margin: 24px; color: #18212f; }
  button { padding: 10px 16px; }
  video { display: block; width: 160px; height: 160px; margin: 16px 0; background: #222; }
  pre { white-space: pre-wrap; border: 1px solid #aab4c3; padding: 12px; }
</style>
<h1>I010 single-frame conversion gate</h1>
<p>One synthetic 16×16 VP9 Profile 2 frame. No permissions, recording, network, storage, or upload.</p>
<button id="run">Run once</button>
<video id="video" muted playsinline></video>
<pre id="out">idle</pre>
<script>
const payload = "GkXfo59ChoEBQveBAULygQRC84EIQoKEd2VibUKHgQJChYECGFOAZwEAAAAAAAIFEU2bdLpNu4tTq4QVSalmU6yBoU27i1OrhBZUrmtTrIHWTbuMU6uEElTDZ1OsggEyTbuMU6uEHFO7a1OsggHv7AEAAAAAAABZAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAVSalmsCrXsYMPQkBNgIxMYXZmNjMuMS4xMDFXQYxMYXZmNjMuMS4xMDFEiYhAj0AAAAAAABZUrmvXrgEAAAAAAABO14EBc8WIOHyfehigK9ucgQAitZyDdW5kiIEAhoVWX1ZQOYOBASPjg4Q7msoA4JCwgRC6gRCagQJVsIRVuYEBVe6BAOwBAAAAAAAAAgAAElTDZ/5zc59jwIBnyJlFo4dFTkNPREVSRIeMTGF2ZjYzLjEuMTAxc3PZY8CLY8WIOHyfehigK9tnyKRFo4dFTkNPREVSRIeXTGF2YzYzLjEuMTAxIGxpYnZweC12cDlnyKFFo4hEVVJBVElPTkSHkzAwOjAwOjAxLjAwMDAwMDAwMAAfQ7Z1teeBAKOwgQAAgJJJg0IAAHgAewAcEg4MAAAAEAAAEL////JhogDH////7vTDh////9v13wAAHFO7a5G7j7OBALeK94EB8YIBtfCBAw==";
const video = document.querySelector('#video');
const output = document.querySelector('#out');
const button = document.querySelector('#run');
let ran = false;

async function run() {
  if (ran) return;
  ran = true;
  button.disabled = true;
  const result = { width: 16, height: 16, codec: 'VP9 Profile 2', frames: 1 };
  let objectUrl;
  try {
    const bytes = Uint8Array.from(atob(payload), character => character.charCodeAt(0));
    result.byteLength = bytes.byteLength;
    objectUrl = URL.createObjectURL(new Blob([bytes], { type: 'video/webm' }));
    video.src = objectUrl;
    await new Promise((resolve, reject) => {
      video.addEventListener('loadeddata', resolve, { once: true });
      video.addEventListener('error', () => reject(video.error || new Error('video error')), { once: true });
      setTimeout(() => reject(new Error('load timeout')), 3000);
    });
    result.videoWidth = video.videoWidth;
    result.videoHeight = video.videoHeight;
    result.readyState = video.readyState;
    result.outcome = 'single-frame-decoded-and-loaded';
  } catch (error) {
    result.outcome = 'exception';
    result.error = `${error.name}: ${error.message}`;
  } finally {
    video.pause();
    video.removeAttribute('src');
    video.load();
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    output.textContent = JSON.stringify(result, null, 2);
    console.log('I010_VIDEO_RESULT ' + JSON.stringify(result));
  }
}

button.addEventListener('click', run, { once: true });
</script>
