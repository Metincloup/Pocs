<!doctype html><meta charset="utf-8"><title>Owned ANGLE D3D uniform check</title>
<style>body{font:16px system-ui;max-width:850px;margin:2rem auto;padding:0 1rem}button{padding:.8rem 1rem;font:inherit}pre{white-space:pre-wrap;border:1px solid #888;padding:1rem}</style>
<h1>Owned ANGLE D3D uniform check</h1><p>Links one small shader and reads one test pixel. No spray, storage, upload, or external request.</p>
<button id="run">Run once</button><pre id="out">Not run.</pre>
<script>
run.onclick=()=>{run.disabled=true;const gl=document.createElement('canvas').getContext('webgl2');
 if(!gl){out.textContent=JSON.stringify({outcome:'no-webgl2'},null,2);return;}
 const vs='#version 300 es\nin vec2 p;void main(){gl_Position=vec4(p,0,1);}';
 const fs='#version 300 es\nprecision highp float;\nuniform int u_zero;\nout vec4 c;\nvoid main(){int i=0;int[2](u_zero,i++);c=(i==1)?vec4(0,1,0,1):vec4(1,0,0,1);}';
 const sh=(t,s)=>{const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);return x};
 const p=gl.createProgram();gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));const started=performance.now();gl.linkProgram(p);
 const linked=gl.getProgramParameter(p,gl.LINK_STATUS),linkLog=gl.getProgramInfoLog(p).slice(0,300);let pixel=[];
 if(linked){gl.useProgram(p);const loc=gl.getUniformLocation(p,'u_zero');if(loc)gl.uniform1i(loc,0);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const a=gl.getAttribLocation(p,'p');gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,2,gl.FLOAT,false,0,0);gl.drawArrays(gl.TRIANGLES,0,3);const px=new Uint8Array(4);gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);pixel=Array.from(px);px.fill(0);}
 out.textContent=JSON.stringify({outcome:'returned',linked,linkLog,pixel,glError:gl.getError(),elapsedMs:Math.round(performance.now()-started),renderer:gl.getParameter(gl.RENDERER),uploaded:false,stored:false},null,2);
};
</script>
