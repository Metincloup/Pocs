<!doctype html>
<meta charset="utf-8">
<title>Owned WebGL backend information</title>
<style>
  body { max-width: 760px; margin: 2rem auto; padding: 0 1rem; font: 16px/1.5 system-ui; }
  button { padding: .75rem 1rem; font: inherit; }
  pre { min-height: 10rem; padding: 1rem; border: 1px solid #888; white-space: pre-wrap; }
</style>
<h1>WebGL backend information</h1>
<p>Reads renderer strings only. It compiles no shader and performs no draw or readback.</p>
<button id="run" type="button">Read backend</button>
<pre id="out">Not run.</pre>
<script>
  const button = document.querySelector('#run');
  const output = document.querySelector('#out');
  button.addEventListener('click', () => {
    button.disabled = true;
    const gl = document.createElement('canvas').getContext('webgl2');
    if (!gl) {
      output.textContent = JSON.stringify({ outcome: 'no-webgl2' }, null, 2);
      return;
    }
    const debug = gl.getExtension('WEBGL_debug_renderer_info');
    output.textContent = JSON.stringify({
      outcome: 'backend-read',
      webglVersion: gl.getParameter(gl.VERSION),
      shadingLanguageVersion: gl.getParameter(gl.SHADING_LANGUAGE_VERSION),
      maskedVendor: gl.getParameter(gl.VENDOR),
      maskedRenderer: gl.getParameter(gl.RENDERER),
      debugRendererInfo: Boolean(debug),
      unmaskedVendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
      unmaskedRenderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null,
      userAgent: navigator.userAgent,
      compiledShader: false,
      drewPixels: false,
      transmittedAnything: false,
    }, null, 2);
  }, { once: true });
</script>
